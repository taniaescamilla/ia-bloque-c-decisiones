<svg viewBox="0 0 700 1520" xmlns="http://www.w3.org/2000/svg" role="img" style="font-family:'Segoe UI',system-ui,sans-serif">
  <title>Pipeline JSON Dev.to - Estilo Flowgorithm</title>
  <desc>Diagrama de flujo de la practica JSON en equipo: 10 pasos desde identificar la API hasta reflexion, con decisiones y loops</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <style>
    .start-end { fill: #2ea043; rx: 25; }
    .process { fill: #1c2333; stroke: #58a6ff; stroke-width: 2; rx: 6; }
    .io { fill: #1c2333; stroke: #d29922; stroke-width: 2; }
    .decision { fill: #1c2333; stroke: #f0883e; stroke-width: 2; }
    .label { fill: #e6edf3; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
    .label-sm { fill: #8b949e; font-size: 11px; text-anchor: middle; dominant-baseline: central; }
    .label-bold { fill: #e6edf3; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .label-start { fill: #fff; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .connector { stroke: #30363d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .connector-yes { stroke: #3fb950; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .connector-no { stroke: #f85149; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .branch-label { font-size: 11px; font-weight: 700; dominant-baseline: central; }
    .yes-label { fill: #3fb950; }
    .no-label { fill: #f85149; }
    .step-badge { fill: #58a6ff; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .file-label { fill: #bc8cff; font-size: 10.5px; text-anchor: middle; dominant-baseline: central; font-style: italic; }
    .legend-box { fill: none; stroke-width: 1.5; rx: 4; }
  </style>

  <!-- Background -->
  <rect width="700" height="1520" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="350" y="30" fill="#58a6ff" font-size="18" font-weight="800" text-anchor="middle">Pipeline JSON en Equipo - Estilo Flowgorithm</text>
  <text x="350" y="50" fill="#8b949e" font-size="12" text-anchor="middle">Practica Dev.to API | Silva - NoSQL 4to Sem</text>

  <!-- Legend -->
  <rect x="20" y="62" width="660" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="6"/>
  <rect x="35" y="70" width="30" height="16" class="legend-box" stroke="#58a6ff" rx="3" fill="#1c2333"/>
  <text x="80" y="78" fill="#8b949e" font-size="10" dominant-baseline="central">Proceso</text>
  <polygon points="145,70 165,78 145,86 125,78" class="legend-box" stroke="#f0883e" fill="#1c2333"/>
  <text x="180" y="78" fill="#8b949e" font-size="10" dominant-baseline="central">Decision</text>
  <polygon points="260,70 280,78 260,86 240,78" class="legend-box" stroke="#d29922" fill="#1c2333"/>
  <text x="305" y="78" fill="#8b949e" font-size="10" dominant-baseline="central">Entrada/Salida</text>
  <rect x="380" y="70" width="30" height="16" fill="#2ea043" rx="8"/>
  <text x="425" y="78" fill="#8b949e" font-size="10" dominant-baseline="central">Inicio/Fin</text>
  <line x1="490" y1="78" x2="520" y2="78" stroke="#3fb950" stroke-width="2"/>
  <text x="535" y="78" fill="#3fb950" font-size="10" dominant-baseline="central">Si</text>
  <line x1="560" y1="78" x2="590" y2="78" stroke="#f85149" stroke-width="2"/>
  <text x="605" y="78" fill="#f85149" font-size="10" dominant-baseline="central">No</text>

  <!-- START -->
  <rect x="250" y="110" width="200" height="40" class="start-end"/>
  <text x="350" y="130" class="label-start">INICIO</text>

  <!-- Arrow START -> Step 1 -->
  <line x1="350" y1="150" x2="350" y2="175" class="connector"/>

  <!-- Step 1: Identificar API -->
  <rect x="200" y="175" width="300" height="50" class="process"/>
  <text x="215" y="188" class="step-badge">1</text>
  <text x="365" y="193" class="label">Identificar API: Dev.to</text>
  <text x="350" y="210" class="label-sm">Leer docs: endpoints, rate limits, auth</text>

  <!-- Arrow -->
  <line x1="350" y1="225" x2="350" y2="250" class="connector"/>

  <!-- Step 2: GET request -->
  <polygon points="350,250 500,280 350,310 200,280" class="io"/>
  <text x="215" y="268" class="step-badge">2</text>
  <text x="365" y="275" class="label">GET /api/articles?tag=ai</text>
  <text x="350" y="293" class="label-sm">Lectura real de la API</text>

  <!-- Arrow -->
  <line x1="350" y1="310" x2="350" y2="335" class="connector"/>

  <!-- Step 3: Analizar JSON -->
  <rect x="200" y="335" width="300" height="50" class="process"/>
  <text x="215" y="348" class="step-badge">3</text>
  <text x="365" y="353" class="label">Analizar estructura JSON</text>
  <text x="350" y="370" class="label-sm">Tipos, anidamiento, arrays</text>

  <!-- Arrow -->
  <line x1="350" y1="385" x2="350" y2="410" class="connector"/>

  <!-- Step 4: Loop por miembro (Decision) -->
  <polygon points="350,410 510,450 350,490 190,450" class="decision"/>
  <text x="220" y="435" class="step-badge">4</text>
  <text x="365" y="445" class="label">Quedan miembros</text>
  <text x="350" y="460" class="label-sm">del equipo?</text>

  <!-- YES arrow down -->
  <line x1="350" y1="490" x2="350" y2="520" class="connector-yes"/>
  <text x="360" y="505" class="branch-label yes-label">Si</text>

  <!-- Step 4 process: GET por tag -->
  <polygon points="350,520 500,550 350,580 200,550" class="io"/>
  <text x="350" y="543" class="label">GET /api/articles?tag={tag}</text>
  <text x="350" y="560" class="file-label">daniel: ai | steph: webdev | abi: datascience</text>

  <!-- Arrow back up (loop) -->
  <line x1="200" y1="550" x2="155" y2="550" stroke="#30363d" stroke-width="2" fill="none"/>
  <line x1="155" y1="550" x2="155" y2="450" stroke="#30363d" stroke-width="2" fill="none"/>
  <line x1="155" y1="450" x2="188" y2="450" class="connector"/>

  <!-- NO arrow right from decision -->
  <line x1="510" y1="450" x2="570" y2="450" class="connector-no"/>
  <text x="525" y="440" class="branch-label no-label">No</text>

  <!-- Continue down from NO -->
  <line x1="570" y1="450" x2="570" y2="610" stroke="#30363d" stroke-width="2" fill="none"/>
  <line x1="570" y1="610" x2="352" y2="610" class="connector"/>

  <!-- Step 5: JSON Schema -->
  <rect x="200" y="600" width="300" height="55" class="process"/>
  <text x="215" y="613" class="step-badge">5</text>
  <text x="365" y="618" class="label">Definir JSON Schema</text>
  <text x="350" y="635" class="label-sm">draft/2020-12, required, types</text>
  <text x="350" y="648" class="file-label">schema_devto_article.json</text>

  <!-- Arrow -->
  <line x1="350" y1="655" x2="350" y2="680" class="connector"/>

  <!-- Step 5b: Validate decision -->
  <polygon points="350,680 490,710 350,740 210,710" class="decision"/>
  <text x="350" y="705" class="label">Schema valido?</text>

  <!-- YES down -->
  <line x1="350" y1="740" x2="350" y2="770" class="connector-yes"/>
  <text x="360" y="755" class="branch-label yes-label">Si</text>

  <!-- NO right -->
  <line x1="490" y1="710" x2="560" y2="710" class="connector-no"/>
  <text x="510" y="700" class="branch-label no-label">No</text>
  <rect x="540" y="695" width="130" height="30" class="process" style="stroke:#f85149"/>
  <text x="605" y="710" class="label" style="font-size:11px">Corregir JSON</text>
  <line x1="605" y1="695" x2="605" y2="660" stroke="#30363d" stroke-width="2" fill="none"/>
  <line x1="605" y1="660" x2="502" y2="660" stroke="#30363d" stroke-width="2" fill="none"/>

  <!-- Step 6: CRUD -->
  <rect x="175" y="770" width="350" height="65" class="process"/>
  <text x="195" y="785" class="step-badge">6</text>
  <text x="365" y="790" class="label-bold">Operaciones CRUD completas</text>
  <text x="350" y="808" class="label-sm">GET(200) POST(201) PUT(200) DELETE(200)</text>
  <text x="350" y="823" class="file-label">demo_crud_devto.html (7 ejercicios)</text>

  <!-- Arrow -->
  <line x1="350" y1="835" x2="350" y2="860" class="connector"/>

  <!-- Step 7: Catalogo -->
  <polygon points="350,860 510,890 350,920 190,890" class="io"/>
  <text x="215" y="878" class="step-badge">7</text>
  <text x="365" y="885" class="label">Catalogo consolidado</text>
  <text x="350" y="903" class="label-sm">15 entries (12 unicos + 3 dup)</text>

  <!-- Arrow -->
  <line x1="350" y1="920" x2="350" y2="950" class="connector"/>

  <!-- Step 8: Postman -->
  <rect x="200" y="950" width="300" height="50" class="process"/>
  <text x="215" y="963" class="step-badge">8</text>
  <text x="365" y="968" class="label">Coleccion Postman</text>
  <text x="350" y="985" class="file-label">8 requests reproducibles v2.1</text>

  <!-- Arrow -->
  <line x1="350" y1="1000" x2="350" y2="1030" class="connector"/>

  <!-- Step 9: MongoDB -->
  <rect x="175" y="1030" width="350" height="70" class="process" style="stroke:#3fb950"/>
  <text x="195" y="1045" class="step-badge">9</text>
  <text x="365" y="1050" class="label-bold" style="fill:#3fb950">Conexion NoSQL (MongoDB)</text>
  <text x="350" y="1070" class="label-sm">insertMany, find, aggregate</text>
  <text x="350" y="1088" class="label-sm">Narrado linea por linea + SQL comparison</text>

  <!-- Arrow -->
  <line x1="350" y1="1100" x2="350" y2="1130" class="connector"/>

  <!-- Step 10: Reflexion -->
  <rect x="200" y="1130" width="300" height="50" class="process" style="stroke:#bc8cff"/>
  <text x="215" y="1143" class="step-badge">10</text>
  <text x="365" y="1148" class="label">Reflexion individual</text>
  <text x="350" y="1165" class="label-sm">Daniel + Stephanie + Abigail</text>

  <!-- Arrow -->
  <line x1="350" y1="1180" x2="350" y2="1210" class="connector"/>

  <!-- Decision: All quality checks pass? -->
  <polygon points="350,1210 510,1250 350,1290 190,1250" class="decision"/>
  <text x="350" y="1243" class="label">Auditoria</text>
  <text x="350" y="1260" class="label-sm">pasa?</text>

  <!-- NO right -->
  <line x1="510" y1="1250" x2="580" y2="1250" class="connector-no"/>
  <text x="525" y="1240" class="branch-label no-label">No</text>
  <rect x="560" y="1235" width="110" height="30" class="process" style="stroke:#f85149"/>
  <text x="615" y="1250" class="label" style="font-size:11px">Fix bugs</text>
  <line x1="615" y1="1265" x2="615" y2="1310" stroke="#30363d" stroke-width="2" fill="none"/>
  <line x1="615" y1="1310" x2="350" y2="1310" stroke="#30363d" stroke-width="2" fill="none"/>

  <!-- YES down -->
  <line x1="350" y1="1290" x2="350" y2="1340" class="connector-yes"/>
  <text x="360" y="1318" class="branch-label yes-label">Si</text>

  <!-- Output: Push to GitHub -->
  <polygon points="350,1340 510,1370 350,1400 190,1370" class="io"/>
  <text x="350" y="1363" class="label">Push a GitHub</text>
  <text x="350" y="1383" class="file-label">taniaescamilla/ia-bloque-c-decisiones</text>

  <!-- Arrow -->
  <line x1="350" y1="1400" x2="350" y2="1430" class="connector"/>

  <!-- END -->
  <rect x="250" y="1430" width="200" height="40" class="start-end"/>
  <text x="350" y="1445" class="label-start">ENTREGA</text>
  <text x="350" y="1462" style="fill:#fff;font-size:10px;text-anchor:middle;dominant-baseline:central">index.html + demo + JSONs</text>

  <!-- Archivos sidebar -->
  <rect x="15" y="110" width="145" height="310" fill="#161b22" stroke="#30363d" stroke-width="1" rx="8"/>
  <text x="87" y="130" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">Archivos generados</text>
  <text x="25" y="150" fill="#bc8cff" font-size="10">index.html</text>
  <text x="25" y="168" fill="#bc8cff" font-size="10">demo_crud_devto.html</text>
  <text x="25" y="186" fill="#d29922" font-size="10">daniel_ai_articles.json</text>
  <text x="25" y="204" fill="#d29922" font-size="10">steph_webdev_articles.json</text>
  <text x="25" y="222" fill="#d29922" font-size="10">abi_datascience_articles.json</text>
  <text x="25" y="240" fill="#3fb950" font-size="10">schema_devto_article.json</text>
  <text x="25" y="258" fill="#3fb950" font-size="10">catalogo_articulos.json</text>
  <text x="25" y="276" fill="#f0883e" font-size="10">Postman_collection.json</text>
  <line x1="25" y1="290" x2="148" y2="290" stroke="#30363d" stroke-width="1"/>
  <text x="87" y="308" fill="#8b949e" font-size="10" text-anchor="middle">8 archivos</text>
  <text x="87" y="324" fill="#8b949e" font-size="10" text-anchor="middle">2,111 lineas</text>
  <text x="87" y="340" fill="#8b949e" font-size="10" text-anchor="middle">Datos 100% reales</text>
  <text x="87" y="360" fill="#3fb950" font-size="10" text-anchor="middle">5 agentes auditaron</text>
  <text x="87" y="376" fill="#3fb950" font-size="10" text-anchor="middle">15 bugs corregidos</text>
  <text x="87" y="396" fill="#3fb950" font-size="11" font-weight="700" text-anchor="middle">ALL PASS</text>
</svg>