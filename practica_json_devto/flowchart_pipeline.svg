<svg viewBox="0 0 700 1580" xmlns="http://www.w3.org/2000/svg" role="img" style="font-family:'Segoe UI',system-ui,sans-serif">
  <title>Pipeline JSON Dev.to - Estilo Flowgorithm</title>
  <desc>Diagrama de flujo de la practica JSON en equipo: 10 pasos desde identificar la API hasta reflexion, con decisiones y loops</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff"/>
    </marker>
  </defs>

  <style>
    .start-end { fill: #2ea043; rx: 25; }
    .process { fill: #1c2333; stroke: #58a6ff; stroke-width: 2; rx: 6; }
    .decision { fill: #1c2333; stroke: #f0883e; stroke-width: 2; }
    .label { fill: #e6edf3; font-size: 13px; text-anchor: middle; dominant-baseline: central; }
    .label-sm { fill: #8b949e; font-size: 11px; text-anchor: middle; dominant-baseline: central; }
    .label-bold { fill: #e6edf3; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .label-start { fill: #fff; font-size: 14px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .connector { stroke: #30363d; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .connector-yes { stroke: #3fb950; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .connector-no { stroke: #f85149; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .branch-label { font-size: 11px; font-weight: 700; dominant-baseline: central; }
    .yes-label { fill: #3fb950; }
    .no-label { fill: #f85149; }
    .step-badge { fill: #58a6ff; font-size: 10px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .file-label { fill: #bc8cff; font-size: 10.5px; text-anchor: middle; dominant-baseline: central; font-style: italic; }
    .legend-box { fill: none; stroke-width: 1.5; rx: 4; }
    .io { fill: #1c2333; stroke: #d29922; stroke-width: 2; }
  </style>

  <!-- Background -->
  <rect width="700" height="1580" fill="#0d1117" rx="12"/>

  <!-- Title -->
  <text x="350" y="30" fill="#58a6ff" font-size="18" font-weight="800" text-anchor="middle">Pipeline JSON en Equipo - Estilo Flowgorithm</text>
  <text x="350" y="50" fill="#8b949e" font-size="12" text-anchor="middle">Practica Dev.to API | Silva - NoSQL 4to Sem</text>

  <!-- Legend -->
  <rect x="20" y="62" width="660" height="32" fill="#161b22" stroke="#30363d" stroke-width="1" rx="6"/>
  <rect x="35" y="70" width="30" height="16" class="legend-box" stroke="#58a6ff" rx="3" fill="#1c2333"/>
  <text x="80" y="78" fill="#8b949e" font-size="10" dominant-baseline="central">Proceso</text>
  <polygon points="145,70 165,78 145,86 125,78" class="legend-box" stroke="#f0883e" fill="#1c2333"/>
  <text x="180" y="78" fill="#8b949e" font-size="10" dominant-baseline="central">Decision</text>
  <!-- I/O legend: parallelogram -->
  <polygon points="235,70 265,70 255,86 225,86" class="legend-box" stroke="#d29922" fill="#1c2333"/>
  <text x="290" y="78" fill="#8b949e" font-size="10" dominant-baseline="central">Entrada/Salida</text>
  <rect x="370" y="70" width="30" height="16" fill="#2ea043" rx="8"/>
  <text x="415" y="78" fill="#8b949e" font-size="10" dominant-baseline="central">Inicio/Fin</text>
  <line x1="480" y1="78" x2="510" y2="78" stroke="#3fb950" stroke-width="2"/>
  <text x="520" y="78" fill="#3fb950" font-size="10" dominant-baseline="central">Si</text>
  <line x1="545" y1="78" x2="575" y2="78" stroke="#f85149" stroke-width="2"/>
  <text x="590" y="78" fill="#f85149" font-size="10" dominant-baseline="central">No</text>

  <!-- START -->
  <rect x="250" y="110" width="200" height="40" class="start-end"/>
  <text x="350" y="130" class="label-start">INICIO</text>

  <line x1="350" y1="150" x2="350" y2="175" class="connector"/>

  <!-- Step 1: Identificar API -->
  <rect x="200" y="175" width="300" height="50" class="process"/>
  <text x="215" y="188" class="step-badge">1</text>
  <text x="365" y="193" class="label">Identificar API: Dev.to</text>
  <text x="350" y="210" class="label-sm">Leer docs: endpoints, rate limits, auth</text>

  <line x1="350" y1="225" x2="350" y2="250" class="connector"/>

  <!-- Step 2: GET request (PARALLELOGRAM for I/O) -->
  <polygon points="220,250 520,250 480,310 180,310" class="io"/>
  <text x="215" y="268" class="step-badge">2</text>
  <text x="360" y="275" class="label">GET /api/articles?tag=ai</text>
  <text x="350" y="293" class="label-sm">Lectura real de la API</text>

  <line x1="350" y1="310" x2="350" y2="335" class="connector"/>

  <!-- Step 3: Analizar JSON -->
  <rect x="200" y="335" width="300" height="50" class="process"/>
  <text x="215" y="348" class="step-badge">3</text>
  <text x="365" y="353" class="label">Analizar estructura JSON</text>
  <text x="350" y="370" class="label-sm">Tipos, anidamiento, arrays</text>

  <line x1="350" y1="385" x2="350" y2="410" class="connector"/>

  <!-- Step 4: Loop decision -->
  <polygon points="350,410 510,450 350,490 190,450" class="decision"/>
  <text x="220" y="435" class="step-badge">4</text>
  <text x="365" y="445" class="label">Quedan miembros</text>
  <text x="350" y="460" class="label-sm">del equipo?</text>

  <!-- YES down -->
  <line x1="350" y1="490" x2="350" y2="520" class="connector-yes"/>
  <text x="360" y="505" class="branch-label yes-label">Si</text>

  <!-- Step 4 process: GET por tag (PARALLELOGRAM) -->
  <polygon points="220,520 520,520 480,565 180,565" class="io"/>
  <text x="350" y="535" class="label">GET /api/articles?tag={tag}</text>
  <text x="350" y="553" class="file-label">daniel: ai | steph: webdev | abi: datascience</text>

  <!-- Advance member process box -->
  <rect x="225" y="580" width="250" height="35" class="process" style="stroke:#3fb950"/>
  <text x="350" y="598" class="label" style="font-size:12px">Guardar resultado, avanzar miembro</text>
  <line x1="350" y1="565" x2="350" y2="580" class="connector"/>

  <!-- Loop back -->
  <line x1="225" y1="598" x2="155" y2="598" stroke="#30363d" stroke-width="2" fill="none"/>
  <line x1="155" y1="598" x2="155" y2="450" stroke="#30363d" stroke-width="2" fill="none"/>
  <line x1="155" y1="450" x2="188" y2="450" class="connector"/>

  <!-- NO arrow right -->
  <line x1="510" y1="450" x2="570" y2="450" class="connector-no"/>
  <text x="525" y="440" class="branch-label no-label">No</text>
  <line x1="570" y1="450" x2="570" y2="650" stroke="#30363d" stroke-width="2" fill="none"/>
  <line x1="570" y1="650" x2="352" y2="650" class="connector"/>

  <!-- Step 5: JSON Schema -->
  <rect x="200" y="640" width="300" height="55" class="process"/>
  <text x="215" y="653" class="step-badge">5</text>
  <text x="365" y="658" class="label">Definir JSON Schema</text>
  <text x="350" y="675" class="label-sm">draft/2020-12, required, types</text>
  <text x="350" y="688" class="file-label">schema_devto_article.json</text>

  <line x1="350" y1="695" x2="350" y2="720" class="connector"/>

  <!-- Step 5b: Validate decision -->
  <polygon points="350,720 490,750 350,780 210,750" class="decision"/>
  <text x="350" y="745" class="label">Schema valido?</text>

  <!-- YES down -->
  <line x1="350" y1="780" x2="350" y2="810" class="connector-yes"/>
  <text x="360" y="795" class="branch-label yes-label">Si</text>

  <!-- NO right + fix loop -->
  <line x1="490" y1="750" x2="560" y2="750" class="connector-no"/>
  <text x="510" y="740" class="branch-label no-label">No</text>
  <rect x="540" y="735" width="130" height="30" class="process" style="stroke:#f85149"/>
  <text x="605" y="750" class="label" style="font-size:11px">Corregir JSON</text>
  <!-- Reconnect to Schema valido? top -->
  <line x1="605" y1="735" x2="605" y2="700" stroke="#30363d" stroke-width="2" fill="none"/>
  <line x1="605" y1="700" x2="490" y2="700" stroke="#30363d" stroke-width="2" fill="none"/>
  <line x1="490" y1="700" x2="490" y2="720" class="connector"/>

  <!-- Step 6: CRUD -->
  <rect x="175" y="810" width="350" height="65" class="process"/>
  <text x="195" y="825" class="step-badge">6</text>
  <text x="365" y="830" class="label-bold">Operaciones CRUD completas</text>
  <text x="350" y="848" class="label-sm">GET(200) POST(201) PUT(200) DELETE(200)</text>
  <text x="350" y="863" class="file-label">demo_crud_devto.html (7 ejercicios)</text>

  <line x1="350" y1="875" x2="350" y2="900" class="connector"/>

  <!-- Step 7: Catalogo (PARALLELOGRAM) -->
  <polygon points="220,900 520,900 480,940 180,940" class="io"/>
  <text x="215" y="913" class="step-badge">7</text>
  <text x="360" y="915" class="label">Catalogo consolidado</text>
  <text x="350" y="933" class="label-sm">15 entries (12 unicos + 3 dup)</text>

  <line x1="350" y1="940" x2="350" y2="970" class="connector"/>

  <!-- Step 8: Postman -->
  <rect x="200" y="970" width="300" height="50" class="process"/>
  <text x="215" y="983" class="step-badge">8</text>
  <text x="365" y="988" class="label">Coleccion Postman</text>
  <text x="350" y="1005" class="file-label">8 requests reproducibles v2.1</text>

  <line x1="350" y1="1020" x2="350" y2="1050" class="connector"/>

  <!-- Step 9: MongoDB -->
  <rect x="175" y="1050" width="350" height="70" class="process" style="stroke:#3fb950"/>
  <text x="195" y="1065" class="step-badge">9</text>
  <text x="365" y="1070" class="label-bold" style="fill:#3fb950">Conexion NoSQL (MongoDB)</text>
  <text x="350" y="1090" class="label-sm">Normalizar JSONs, insertMany, find, aggregate</text>
  <text x="350" y="1108" class="label-sm">Narrado linea por linea + SQL comparison</text>

  <line x1="350" y1="1120" x2="350" y2="1150" class="connector"/>

  <!-- Step 10: Reflexion -->
  <rect x="200" y="1150" width="300" height="50" class="process" style="stroke:#bc8cff"/>
  <text x="215" y="1163" class="step-badge">10</text>
  <text x="365" y="1168" class="label">Reflexion individual</text>
  <text x="350" y="1185" class="label-sm">Daniel + Stephanie + Abigail</text>

  <line x1="350" y1="1200" x2="350" y2="1230" class="connector"/>

  <!-- Decision: Auditoria -->
  <polygon points="350,1230 510,1270 350,1310 190,1270" class="decision"/>
  <text x="350" y="1263" class="label">Auditoria</text>
  <text x="350" y="1280" class="label-sm">pasa?</text>

  <!-- NO right + fix loop back to auditoria -->
  <line x1="510" y1="1270" x2="580" y2="1270" class="connector-no"/>
  <text x="525" y="1260" class="branch-label no-label">No</text>
  <rect x="560" y="1255" width="110" height="30" class="process" style="stroke:#f85149"/>
  <text x="615" y="1270" class="label" style="font-size:11px">Fix bugs</text>
  <!-- Fix bugs loops BACK to auditoria decision, not past it -->
  <line x1="615" y1="1255" x2="615" y2="1220" stroke="#30363d" stroke-width="2" fill="none"/>
  <line x1="615" y1="1220" x2="490" y2="1220" stroke="#30363d" stroke-width="2" fill="none"/>
  <line x1="490" y1="1220" x2="490" y2="1230" class="connector"/>

  <!-- YES down -->
  <line x1="350" y1="1310" x2="350" y2="1360" class="connector-yes"/>
  <text x="360" y="1338" class="branch-label yes-label">Si</text>

  <!-- Output: Push to GitHub (PARALLELOGRAM) -->
  <polygon points="220,1360 520,1360 480,1400 180,1400" class="io"/>
  <text x="360" y="1373" class="label">Push a GitHub</text>
  <text x="350" y="1393" class="file-label">taniaescamilla/ia-bloque-c-decisiones</text>

  <line x1="350" y1="1400" x2="350" y2="1440" class="connector"/>

  <!-- END -->
  <rect x="250" y="1440" width="200" height="40" class="start-end"/>
  <text x="350" y="1455" class="label-start">ENTREGA</text>
  <text x="350" y="1470" style="fill:#fff;font-size:10px;text-anchor:middle;dominant-baseline:central">index.html + demo + JSONs + SVG</text>

  <!-- Archivos sidebar -->
  <rect x="15" y="110" width="155" height="340" fill="#161b22" stroke="#30363d" stroke-width="1" rx="8"/>
  <text x="92" y="130" fill="#58a6ff" font-size="11" font-weight="700" text-anchor="middle">Archivos generados</text>
  <text x="25" y="150" fill="#bc8cff" font-size="10">index.html</text>
  <text x="25" y="168" fill="#bc8cff" font-size="10">demo_crud_devto.html</text>
  <text x="25" y="186" fill="#d29922" font-size="10">daniel_ai_articles.json</text>
  <text x="25" y="204" fill="#d29922" font-size="10">stephanie_webdev_articles.json</text>
  <text x="25" y="222" fill="#d29922" font-size="10">abigail_datascience_articles.json</text>
  <text x="25" y="240" fill="#3fb950" font-size="10">schema_devto_article.json</text>
  <text x="25" y="258" fill="#3fb950" font-size="10">catalogo_articulos_devto.json</text>
  <text x="25" y="276" fill="#f0883e" font-size="10">Practica_DevTo_API...json</text>
  <text x="25" y="294" fill="#bc8cff" font-size="10">flowchart_pipeline.svg</text>
  <line x1="25" y1="310" x2="158" y2="310" stroke="#30363d" stroke-width="1"/>
  <text x="92" y="328" fill="#8b949e" font-size="10" text-anchor="middle">9 archivos</text>
  <text x="92" y="346" fill="#8b949e" font-size="10" text-anchor="middle">Datos 100% reales</text>
  <text x="92" y="364" fill="#8b949e" font-size="10" text-anchor="middle">Auditado por 2 AIs</text>
  <text x="92" y="382" fill="#8b949e" font-size="10" text-anchor="middle">+ verificacion manual</text>
  <text x="92" y="404" fill="#8b949e" font-size="10" text-anchor="middle">Forem V1 headers</text>
  <text x="92" y="422" fill="#3fb950" font-size="10" text-anchor="middle">MongoDB normalizado</text>
</svg>